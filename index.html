<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Strongbuilt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <div id="error-display" style="display: none; color: red; padding: 20px; font-family: monospace; z-index: 9999; position: absolute; background: white;"></div>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const errDiv = document.getElementById('error-display');
      errDiv.style.display = 'block';
      errDiv.innerText += message + '\n';
    };
    window.addEventListener('unhandledrejection', function(event) {
      const errDiv = document.getElementById('error-display');
      errDiv.style.display = 'block';
      errDiv.innerText += 'Unhandled Rejection: ' + event.reason + '\n';
    });
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
